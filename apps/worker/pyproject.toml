[project]
name = "natalka-worker"
version = "0.1.0"
description = "Internal API and job worker"
requires-python = ">=3.12"
dependencies = ["natalka-engine", "natalka-document", "natalka-texts", "natalka-shared", "fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natalka_worker"]
