[project]
name = "natalka-document"
version = "0.1.0"
description = "Document schema and PDF rendering"
requires-python = ">=3.12"
dependencies = ["natalka-engine", "pydantic>=2.9", "reportlab>=4.2", "svglib>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natalka_document"]
