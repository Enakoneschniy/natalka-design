[project]
name = "natalka-engine"
version = "0.1.0"
description = "Astrological calculation engine: positions, houses, aspects, transits, geocoding"
requires-python = ">=3.12"
dependencies = [
  "pyswisseph>=2.10.3.2",
  "timezonefinder>=6.5",
  "pydantic>=2.9",
]

[project.scripts]
natalka-engine = "natalka_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natalka_engine"]
