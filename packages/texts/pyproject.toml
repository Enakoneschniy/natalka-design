[project]
name = "natalka-texts"
version = "0.1.0"
description = "Section prompts, LLM client and validators"
requires-python = ">=3.12"
dependencies = ["natalka-engine", "httpx>=0.27", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natalka_texts"]
