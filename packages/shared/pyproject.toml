[project]
name = "natalka-shared"
version = "0.1.0"
description = "Shared runtime pieces: settings, crypto, alerts"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natalka_shared"]
