name: API container

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/worker/**'
      - 'apps/api-edge/**'
      - 'infra/Dockerfile'
      - 'uv.lock'
      - '.github/workflows/container.yml'
  workflow_dispatch:

# The token only reads the repository; the deploy authenticates to Cloudflare with its own secret.
permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the release tag is in the comment); Dependabot bumps them.
jobs:
  build-and-deploy:
    name: build image · deploy worker
    # Deploys only from main, and only with the production environment's secrets.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/natalka-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build image (amd64, the only architecture Containers run)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "NATALKA_BUILD=${GITHUB_SHA::12}" \
            --file infra/Dockerfile \
            --tag "$IMAGE:${GITHUB_SHA::12}" \
            --tag "$IMAGE:latest" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load .
          docker image inspect "$IMAGE:${GITHUB_SHA::12}" --format 'image size: {{.Size}} bytes'

      - name: Push to the Cloudflare registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/api-edge
        run: |
          pnpm exec wrangler containers push "$IMAGE:${GITHUB_SHA::12}"
          pnpm exec wrangler containers push "$IMAGE:latest"

      - name: Deploy the edge worker with this image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/api-edge
        run: |
          sed -i "s|natalka-api:latest|natalka-api:${GITHUB_SHA::12}|" wrangler.jsonc
          pnpm exec wrangler deploy

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/out -w '%{http_code}' https://natalka-api.ceo-63e.workers.dev/health || true)
            [ "$code" = "200" ] && cat /tmp/out && exit 0
            sleep 6
          done
          echo "health check failed"; cat /tmp/out || true; exit 1
