name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checks only read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the release tag is in the comment); Dependabot bumps them.
jobs:
  python:
    name: python (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run ruff check packages apps
      - name: ruff (format)
        run: uv run ruff format --check packages apps
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q

  web:
    name: web (biome · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: biome
        run: pnpm exec biome ci .
      - name: typecheck
        run: pnpm --filter @natalka/web exec tsc --noEmit
      - name: tests
        run: pnpm --filter @natalka/web test
      - name: next build
        run: pnpm --filter @natalka/web build

  jobs:
    name: jobs (types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm --filter @natalka/jobs exec tsc --noEmit
      - name: typecheck (tests)
        if: hashFiles('apps/jobs/test/tsconfig.json') != ''
        run: pnpm --filter @natalka/jobs exec tsc --noEmit -p test/tsconfig.json
      - name: tests
        run: pnpm --filter @natalka/jobs test

  api-edge:
    name: api-edge (biome · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: biome
        run: pnpm exec biome ci apps/api-edge
      - name: typecheck
        run: pnpm --filter @natalka/api-edge exec tsc --noEmit
      - name: tests
        run: pnpm --filter @natalka/api-edge run --if-present test

  bot:
    name: bot (biome · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: biome
        run: pnpm exec biome ci apps/bot
      - name: typecheck
        run: pnpm --filter @natalka/bot exec tsc --noEmit
      - name: tests
        run: pnpm --filter @natalka/bot test

  pdf:
    name: example PDF renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --frozen
      - name: render the bundled example
        run: uv run natalka-document render packages/document/examples/natal-uk.json /tmp/natal-uk.pdf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: natal-uk.pdf
          path: /tmp/natal-uk.pdf
          retention-days: 14
