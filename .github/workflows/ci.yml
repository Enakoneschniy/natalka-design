name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checks only read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the release tag is in the comment); Dependabot bumps them.
jobs:
  python:
    name: python (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run ruff check packages apps
      - name: ruff (format)
        run: uv run ruff format --check packages apps
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q

  web:
    name: web (biome · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: biome
        run: pnpm exec biome ci .
      - name: typecheck
        run: pnpm --filter @natalka/web exec tsc --noEmit
      - name: tests
        run: pnpm --filter @natalka/web test
      - name: next build
        run: pnpm --filter @natalka/web build

  jobs:
    name: jobs (types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm --filter @natalka/jobs exec tsc --noEmit
      - name: typecheck (tests)
        if: hashFiles('apps/jobs/test/tsconfig.json') != ''
        run: pnpm --filter @natalka/jobs exec tsc --noEmit -p test/tsconfig.json
      - name: tests
        run: pnpm --filter @natalka/jobs test

  api-edge:
    name: api-edge (biome · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: biome
        run: pnpm exec biome ci apps/api-edge
      - name: typecheck
        run: pnpm --filter @natalka/api-edge exec tsc --noEmit
      - name: tests
        run: pnpm --filter @natalka/api-edge run --if-present test

  bot:
    name: bot (biome · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: biome
        run: pnpm exec biome ci apps/bot
      - name: typecheck
        run: pnpm --filter @natalka/bot exec tsc --noEmit
      - name: tests
        run: pnpm --filter @natalka/bot test

  pdf:
    name: example PDF renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --frozen
      - name: render the bundled example
        run: uv run natalka-document render packages/document/examples/natal-uk.json /tmp/natal-uk.pdf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: natal-uk.pdf
          path: /tmp/natal-uk.pdf
          retention-days: 14
