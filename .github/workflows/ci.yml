name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run ruff check packages apps
      - name: ruff (format)
        run: uv run ruff format --check packages apps
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q

  web:
    name: web (biome · types · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: biome
        run: pnpm exec biome ci .
      - name: typecheck
        run: pnpm --filter @natalka/web exec tsc --noEmit
      - name: next build
        run: pnpm --filter @natalka/web build

  pdf:
    name: example PDF renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --frozen
      - name: render the bundled example
        run: uv run natalka-document render packages/document/examples/natal-uk.json /tmp/natal-uk.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: natal-uk.pdf
          path: /tmp/natal-uk.pdf
          retention-days: 14
