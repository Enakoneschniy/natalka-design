# Monthly, one grouped pull request per ecosystem: the pinned workflow actions and the
# container's base images (infra/Dockerfile).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: monthly
    groups:
      base-images:
        patterns: ["*"]
